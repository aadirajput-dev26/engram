services:
  - type: web
    name: geogyan-rag-pipeline
    env: python
    plan: starter

    # Run migrations then start the server
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2

    envVars:
      - key: SERVICE_ENV
        value: production
      - key: AI_SERVICE_API_KEY
        sync: false        # Set this manually in the Render dashboard
      - key: AI_DATABASE_URL
        sync: false        # Supabase connection string — set in dashboard
      - key: QDRANT_URL
        sync: false        # Your Qdrant Cloud cluster URL
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false        # Gemini or OpenAI key
      - key: LLM_MODEL_NAME
        value: gemini-2.0-flash-lite
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-base-en-v1.5
      - key: RERANKER_MODEL_NAME
        value: BAAI/bge-reranker-base
      - key: STORAGE_BACKEND
        value: local        # Files are handled in-memory during ingestion; no persistent disk needed
